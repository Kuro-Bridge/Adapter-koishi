# 本仓首个 CI：单一 gate 命令承载全部门禁（与本地 `bun run gate` 完全同构）。
#
# 解析面口径：CI 独立解析、不提交 lockfile——发布件测的就是消费方 `bun/npm install`
# 拿到的解析面；上游（如 @kuro-bridge/protocol）发新版导致语义漂移时，金样本对表
# 测试会当场红（绊线语义），收敛动作是升对表锚而不是锁死旧版本。
# Bun 自动安装 peer 依赖（koishi shim），无需显式处理。
name: CI
on:
    push:
        branches: [main]
    pull_request:
jobs:
    gate:
        name: gate（check + test + build）
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2 # 对齐宿主工作区 packageManager
            - name: 安装依赖（独立解析）
              run: bun install
            - name: 全量门禁
              run: bun run gate
