# Bug 报告模板：类型标签 bug 自带，范围留给正文描述，模块由维护者补挂。

name: Bug 报告
description: 报告 Koishi 官方对端插件 koishi-plugin-kurobridge 的问题
title: "Bug: "
labels:
  - bug
body:
  - type: dropdown
    attributes:
      label: 受影响的范围
      description: 问题落在哪个模块；涉及多个时在补充信息里说明。
      options:
        - 连接与重连（connection）
        - 消息翻译（translate）
        - 适配核心（adapter）
        - Koishi 装配与配置（index）
        - 协议消费与 golden 测试（protocol）
        - 不确定
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 请简明扼要地描述遇到了什么问题。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 请描述如何触发这个问题，越具体越好。
      placeholder: |
        1. 配置 url '...' 启用插件
        2. 在频道发送 '...'
        3. 观察到 '...'
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望行为
      description: 请描述你期望发生的行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 相关日志与截图
      description: 请尽量附上 Koishi 控制台日志、聊天记录或相关截图。日志较长时只保留关键部分，并用代码块包裹。
  - type: textarea
    attributes:
      label: 运行环境
      description: 请填写运行环境的版本信息。
      value: |
        - 操作系统: <!-- 例如 Windows 11 / Ubuntu 24.04 -->
        - 宿主运行时: <!-- 例如 Bun 1.4.2（koishi-dev 环境） -->
        - Koishi 版本: <!-- 例如 4.18.11 -->
        - koishi-plugin-kurobridge 版本: <!-- 例如 0.2.0 -->
        - 服务端与协议版本: <!-- 例如 KuroAdapter-Pure 0.1.0 / kurobridge-ws 0.4.0 -->
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 其他需要补充的上下文，例如插件配置片段（注意隐去 token 等敏感信息）。
